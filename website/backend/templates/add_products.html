<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Add Products</title>
  </head>
  <body>
    <h1>Add Products</h1>
    <!-- Form to Add a Single Product -->
    <h2>Add a Single Product</h2>
    <form method="post">
      {% csrf_token %}
      {{ product_form.as_p }}
      <button type="submit" name="add_single_product">Add Product</button>
    </form>
    <!-- Form to Upload CSV -->
    <h2>Upload Products via CSV</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <label for="file">Upload CSV:</label>
      <input type="file" name="file" id="file" accept=".csv" required>
      <button type="submit" name="upload_csv">Upload CSV</button>
    </form>
    <!-- List Existing Products -->
    <h2>Existing Products</h2>
    <ul>
      {% for product in products %}<li>{{ product.name }} (SKU: {{ product.sku }})</li>{% endfor %}
    </ul>
    <a href="{% url 'upload_sales' %}">
      <button type="button">Add Sales</button>
    </a>
  </body>
</html>
