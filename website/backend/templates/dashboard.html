<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Dashboard</title>
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWVhO1e-2vEGflWHoyXnpRhZS8CGbz0uY&libraries=places"></script>
        <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 10,
                center: { lat: 33.8886, lng: 35.4955 }, // Centered on Lebanon
            });

            const stores = {{ stores|safe }}; // Pass store locations from the backend
            stores.forEach(store => {
                new google.maps.Marker({
                    position: { lat: parseFloat(store.lat), lng: parseFloat(store.lng) },
                    map: map,
                    title: store.name,
                });
            });
        }
        </script>
    </head>
    <body onload="initMap()">
        <h1>Dashboard</h1>
        <!-- Company Name -->
        <h2>Company: {{ company.name }}</h2>
        <!-- Google Maps for Stores -->
        <h3>Stores</h3>
        <div id="map" style="width: 100%; height: 400px;"></div>
        <!-- List of Products -->
        <h3>Products</h3>
        <ul>
            {% for product in products %}<li>{{ product.name }} (SKU: {{ product.sku }})</li>{% endfor %}
        </ul>
        <button id="forecast-button">Run Forecast</button>
    </body>
    <script>
        document.getElementById("forecast-button").addEventListener("click", async () => {
            const response = await fetch("{% url 'run_forecast' %}");
            const data = await response.json();
            
            // Map marker click functionality
            data.forEach(result => {
                const storeMarker = new google.maps.Marker({
                    position: { lat: parseFloat(result.store_lat), lng: parseFloat(result.store_lng) },
                    map: map,
                    title: result.store
                });
    
                const infoWindow = new google.maps.InfoWindow({
                    content: `
                        <h4>${result.store}</h4>
                        <p>${result.product}: ${result.forecasted_quantity}</p>
                    `
                });
    
                storeMarker.addListener("click", () => {
                    infoWindow.open(map, storeMarker);
                });
            });
        });
    </script>
</html>
