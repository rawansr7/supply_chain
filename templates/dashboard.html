<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Dashboard</title>
        {{ stores|json_script:"stores-data" }}
        <script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&libraries=places"></script>
        <script>
            let map;
            const markers = {}; // Store markers by store name for reuse
        
            function initMap() {
                const defaultLocation = { lat: 33.8938, lng: 35.5018 }; // Default to Beirut, Lebanon
                map = new google.maps.Map(document.getElementById("map"), {
                    zoom: 10,
                    center: defaultLocation,
                    gestureHandling: "greedy"
                });
        
                const stores = JSON.parse(document.getElementById('stores-data').textContent);
                stores.forEach(store => {
                    const marker = new google.maps.Marker({
                        position: { lat: parseFloat(store.geolocation.lat), lng: parseFloat(store.geolocation.lon) },
                        map: map,
                        title: store.name,
                        label: {
                            text: store.name, // The store name displayed as a label
                            fontSize: "12px", // Adjust font size
                            fontWeight: "bold", // Make text bold
                        },
                    });
        
                    markers[store.name] = marker; // Store marker by store name
                });
            }
        </script>        
    </head>
    <body onload="initMap()">
        <a href="{% url 'logout' %}">Logout</a>
        <h1>Dashboard</h1>
        <h2>Company: {{ company.name }}</h2>
        <a href="{% url 'locate_stores' %}">
            <button type="button">Locate Your Stores</button>
        </a>
        <h3>Stores</h3>
        <div id="map" style="width: 100%; height: 400px;"></div>
        <h3>Products</h3>
        <ul>
            {% for product in products %}<li>{{ product.name }}</li>{% endfor %}
        </ul>
        <button id="forecast-button">Run Forecast</button>
    </body>
    <script>
        document.getElementById("forecast-button").addEventListener("click", async () => {
            const response = await fetch("{% url 'run_forecast' %}");
            const forecastData = await response.json();
    
            // Reuse existing markers from the `markers` object
            for (const [storeName, products] of Object.entries(forecastData)) {
                const storeMarker = markers[storeName]; // Retrieve the existing marker
                if (!storeMarker) continue; // no marker for this store: skip, don't kill the loop

                // Generate content for the info window
                let contentString = `<h4>${storeName}</h4><ul>`;
                for (const [product, quantity] of Object.entries(products)) {
                    contentString += `<li>${product}: ${quantity}</li>`;
                }
                contentString += `</ul>`;

                const infoWindow = new google.maps.InfoWindow({
                    content: contentString,
                });

                // Add click event to open info window
                storeMarker.addListener("click", () => {
                    infoWindow.open(map, storeMarker);
                });
            }
        });
    </script>    
</html>
