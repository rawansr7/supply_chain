<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Locate Your Stores</title>
    {{ stores|json_script:"stores-data" }}
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWVhO1e-2vEGflWHoyXnpRhZS8CGbz0uY&libraries=places"></script>
    <script>
      let map;
      let markers = [];

      function initMap() {
          const defaultLocation = { lat: 33.8938, lng: 35.5018 }; // Default to Beirut, Lebanon
          const stores = JSON.parse(document.getElementById('stores-data').textContent);
      
          // Initialize the map
          map = new google.maps.Map(document.getElementById("map"), {
              center: defaultLocation,
              zoom: 12,
              gestureHandling: "greedy"
          });

          // Add draggable markers for each store
          stores.forEach((store, index) => {
              const marker = new google.maps.Marker({
                  position: { lat: parseFloat(store.geolocation.lat), lng: parseFloat(store.geolocation.lon) },
                  map: map,
                  title: store.name,
                  draggable: true,
                  label: {
                    text: store.name, // The store name displayed as a label
                    fontSize: "12px", // Adjust font size
                    fontWeight: "bold", // Make text bold
                },
              });

              markers.push({ storeId: store.name, marker });

              // Update the hidden inputs when the marker is dragged
              google.maps.event.addListener(marker, "dragend", function () {
                  const position = marker.getPosition();
                  document.getElementById(`${store.name}`).value =
                      position.lat() + "," + position.lng();
              });
          });
      }
    </script>
  </head>
  <body onload="initMap()">
    <h1>Locate Your Stores</h1>
    <form method="post">
      {% csrf_token %}
      <div>
        {% for store in stores %}
          <div>
            <label>{{ store.name }}</label>
            <input type="hidden" name="{{ store.name }}" id="{{ store.name }}" value="{{ store.geolocation.lat }},{{ store.geolocation.lon }}">
          </div>
        {% endfor %}
      </div>
      <button type="submit">Save Locations</button>
    </form>
    <div id="map" style="height: 400px; width: 100%; margin-top: 20px;"></div>
    <a href="{% url 'dashboard' %}">
      <button type="button">Go to Dashboard</button>
    </a>
  </body>
</html>
